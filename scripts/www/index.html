<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>明阅眼镜视觉训练卡收费标准</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
      background-attachment: fixed;
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border: none;
      border-radius: 24px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      padding: 35px;
      position: relative;
      transform: translateY(0);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(90deg, #5a9bd5, #e63946);
      z-index: 2;
    }

    .title {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 35px;
      color: #2c3e50;
      position: relative;
      letter-spacing: 1.2px;
      line-height: 1.3;
    }

    .title::after {
      content: '';
      display: block;
      width: 100px;
      height: 5px;
      background: linear-gradient(90deg, #5a9bd5, #e63946);
      margin: 20px auto 0;
      border-radius: 3px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 35px;
      border-radius: 35px;
      font-size: 26px;
      font-weight: 600;
      margin: 35px 0 25px;
      text-align: center;
      color: white;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      min-height: 60px;
    }

    .section-title::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .section-title:hover::before {
      left: 100%;
    }

    .myopia {
      background: linear-gradient(135deg, #5a9bd5 0%, #4a89dc 100%);
    }

    .amblyopia {
      background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
    }

    .price-list {
      margin: 30px 0;
      font-size: 21px;
      line-height: 2.4;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .price-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 30px;
      transition: all 0.3s ease;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .price-list li:last-child {
      border-bottom: none;
    }

    .price-list li:nth-child(even) {
      background-color: rgba(90, 155, 213, 0.04);
    }

    .price-list li:hover {
      background-color: rgba(90, 155, 213, 0.08);
      transform: translateX(5px);
    }

    .price-list .item-name {
      font-weight: 500;
      color: #34495e;
      flex: 1;
    }

    .price-list .item-price {
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: 0.5px;
      min-width: 160px;
      text-align: right;
    }

    .price-list .note {
      font-size: 20px;
      color: #e74c3c;
      margin: 25px 0 12px;
      text-align: center;
      font-weight: 600;
      padding: 16px;
      background: rgba(231, 76, 60, 0.08);
      border-radius: 10px;
      border-left: 5px solid #e74c3c;
      line-height: 1.5;
    }

    .footer {
      margin-top: 45px;
      text-align: center;
      color: #7f8c8d;
      font-size: 18px;
      padding-top: 25px;
      border-top: 1px solid #ecf0f1;
    }

    .footer p {
      margin: 8px 0;
      line-height: 1.6;
    }

    .highlight {
      background: linear-gradient(120deg, #a8edea 0%, #fed6e3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    /* 桌面端优化 */
    @media screen and (min-width: 1025px) {
      body {
        padding: 50px 30px;
      }
      
      .card {
        max-width: 900px;
        padding: 45px;
      }
      
      .title {
        font-size: 40px;
        margin-bottom: 40px;
      }
      
      .section-title {
        font-size: 28px;
        padding: 20px 40px;
      }
      
      .price-list {
        font-size: 22px;
        line-height: 2.5;
      }
      
      .price-list li {
        padding: 20px 35px;
      }
      
      .price-list .item-price {
        min-width: 180px;
      }
      
      .price-list .note {
        font-size: 21px;
        padding: 18px;
      }
      
      .footer {
        font-size: 19px;
      }
    }

    /* 平板设备通用优化 */
    @media screen and (min-width: 768px) and (max-width: 1024px) {
      body {
        padding: 40px 25px;
      }
      
      .card {
        padding: 40px;
      }
      
      .title {
        font-size: 34px;
        margin-bottom: 35px;
      }
      
      .section-title {
        font-size: 25px;
        padding: 17px 32px;
      }
      
      .price-list {
        font-size: 20px;
        line-height: 2.3;
      }
      
      .price-list .item-price {
        min-width: 150px;
      }
      
      .price-list .note {
        font-size: 19px;
        padding: 15px;
      }
      
      .footer {
        font-size: 17px;
      }
    }

    /* 小尺寸平板优化 */
    @media screen and (min-width: 768px) and (max-width: 899px) {
      body {
        padding: 35px 20px;
      }
      
      .card {
        padding: 35px;
      }
      
      .title {
        font-size: 32px;
        margin-bottom: 32px;
      }
      
      .section-title {
        font-size: 24px;
        padding: 16px 30px;
      }
      
      .price-list {
        font-size: 19px;
        line-height: 2.2;
      }
      
      .price-list .item-price {
        min-width: 140px;
      }
      
      .price-list .note {
        font-size: 18px;
        padding: 14px;
      }
      
      .footer {
        font-size: 16px;
      }
    }

    /* 中等尺寸平板优化 */
    @media screen and (min-width: 900px) and (max-width: 1024px) {
      body {
        padding: 45px 30px;
      }
      
      .card {
        padding: 42px;
      }
      
      .title {
        font-size: 36px;
        margin-bottom: 37px;
      }
      
      .section-title {
        font-size: 26px;
        padding: 18px 35px;
      }
      
      .price-list {
        font-size: 21px;
        line-height: 2.3;
      }
      
      .price-list .item-price {
        min-width: 160px;
      }
      
      .price-list .note {
        font-size: 20px;
        padding: 16px;
      }
      
      .footer {
        font-size: 18px;
      }
    }

    /* 大尺寸平板优化 */
    @media screen and (min-width: 1025px) and (max-width: 1200px) {
      body {
        padding: 50px 35px;
      }
      
      .card {
        max-width: 950px;
        padding: 48px;
      }
      
      .title {
        font-size: 38px;
      }
      
      .section-title {
        font-size: 27px;
        padding: 19px 38px;
      }
      
      .price-list {
        font-size: 21px;
      }
      
      .price-list .item-price {
        min-width: 170px;
      }
      
      .price-list .note {
        font-size: 20px;
      }
      
      .footer {
        font-size: 18px;
      }
    }

    /* 超大平板优化 */
    @media screen and (min-width: 1201px) and (max-width: 1400px) {
      body {
        padding: 60px 40px;
      }
      
      .card {
        max-width: 1000px;
        padding: 50px;
      }
      
      .title {
        font-size: 42px;
      }
      
      .section-title {
        font-size: 30px;
        padding: 22px 42px;
      }
      
      .price-list {
        font-size: 23px;
      }
      
      .price-list .item-price {
        min-width: 190px;
      }
      
      .price-list .note {
        font-size: 22px;
      }
      
      .footer {
        font-size: 20px;
      }
    }

    /* 针对各种平板横竖屏方向优化 */
    @media screen and (min-width: 768px) and (max-width: 1400px) and (orientation: landscape) {
      body {
        padding: 45px 30px;
      }
      
      .card {
        padding: 45px;
      }
      
      .title {
        font-size: 36px;
      }
      
      .section-title {
        font-size: 26px;
        padding: 19px 38px;
      }
      
      .price-list {
        font-size: 21px;
      }
      
      .price-list .item-price {
        min-width: 170px;
      }
      
      .price-list .note {
        font-size: 20px;
      }
      
      .footer {
        font-size: 18px;
      }
    }

    @media screen and (min-width: 768px) and (max-width: 1400px) and (orientation: portrait) {
      body {
        padding: 40px 25px;
      }
      
      .card {
        padding: 40px;
      }
      
      .title {
        font-size: 34px;
      }
      
      .section-title {
        font-size: 25px;
        padding: 18px 35px;
      }
      
      .price-list {
        font-size: 20px;
      }
      
      .price-list .item-price {
        min-width: 150px;
      }
      
      .price-list .note {
        font-size: 19px;
      }
      
      .footer {
        font-size: 17px;
      }
    }

    /* 移动设备优化 */
    @media screen and (max-width: 767px) {
      body {
        padding: 20px 15px;
      }
      
      .card {
        padding: 28px 22px;
      }
      
      .title {
        font-size: 28px;
        margin-bottom: 28px;
      }
      
      .section-title {
        font-size: 22px;
        padding: 15px 25px;
        margin: 28px 0 20px;
      }
      
      .price-list {
        font-size: 18px;
        line-height: 2.2;
      }
      
      .price-list li {
        padding: 15px 22px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .price-list .item-name,
      .price-list .item-price {
        text-align: left;
      }
      
      .price-list .item-price {
        min-width: auto;
        font-size: 17px;
      }
      
      .price-list .note {
        font-size: 17px;
        padding: 14px;
      }
      
      .footer {
        font-size: 16px;
        margin-top: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">明阅眼镜<br/>视觉训练卡收费标准</h1>

    <!-- 近视管理 -->
    <div class="section-title myopia">近视管理</div>
    <ul class="price-list">
      <li><span class="item-name">单次训练</span><span class="item-price">99元（单次）</span></li>
      <li><span class="item-name">月度训练</span><span class="item-price">680元（12次）</span></li>
      <li><span class="item-name">半年训练</span><span class="item-price">3200元（无限次）</span></li>
      <li><span class="item-name">年度训练</span><span class="item-price">5800元（无限次）</span></li>
    </ul>
    <p class="price-list note">年度无忧换镜 <span class="highlight">6800元</span></p>

    <!-- 斜弱视训练 -->
    <div class="section-title amblyopia">斜弱视训练</div>
    <ul class="price-list">
      <li><span class="item-name">轻度弱视 0.5~0.8</span><span class="item-price">6800元/年</span></li>
      <li><span class="item-name">中度弱视 0.2~0.4</span><span class="item-price">8800元/年</span></li>
      <li><span class="item-name">重度弱视 0.15及以下</span><span class="item-price">12800元/年</span></li>
    </ul>
    <p class="price-list note">年度无忧换镜 +<span class="highlight">800 元</span></p>

    <div class="footer">
      <p>&copy; 明阅眼镜 · 视觉训练服务</p>
      <p>专业视力矫正 · 品质服务保障</p>
    </div>
  </div>
</body>
</html>
